<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500&family=Playfair+Display:wght@700&family=Poppins:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/src/style.css">
    <title>Registro | Food Store</title>
    <script type="module" src="/src/main.ts"></script>
</head>

<body>
    <main class="auth">
        <aside class="auth__hero auth__hero--registro" aria-hidden="true">
            <img class="auth__hero-img" src="/img/hero-parrilla.jpg" alt="" decoding="async">
            <div class="auth__hero-text">
                <p class="auth__hero-tagline">Recién salido del fuego</p>
                <p class="auth__hero-title">Sumate a <span class="auth__hero-accent">la mesa.</span></p>
            </div>
        </aside>
        <section class="auth__card">
            <p class="auth__brand">Food <span class="auth__brand-accent">Store</span></p>
            <h1 class="auth__title">Crear cuenta</h1>
            <p class="auth__subtitle">Creá tu cuenta y empezá a pedir.</p>
            <form id="form-registro" class="auth__form" novalidate>
                <div class="auth__field">
                    <label class="auth__label" for="email">Email</label>
                    <input class="auth__input" type="email" name="email" id="email" autocomplete="email">
                </div>
                <div class="auth__field">
                    <label class="auth__label" for="password">Contraseña</label>
                    <input class="auth__input" type="password" name="password" id="password"
                        autocomplete="new-password">
                </div>
                <div class="auth__field">
                    <label class="auth__label" for="confirmPassword">Confirmar contraseña</label>
                    <input class="auth__input" type="password" name="confirmPassword" id="confirmPassword"
                        autocomplete="new-password">
                </div>
                <p id="mensaje" class="auth__message" aria-live="polite"></p>
                <button type="submit" class="auth__button">Registrarme</button>
            </form>
            <p class="auth__footer">¿Ya tenés cuenta? <a class="auth__link" href="../login/login.html">Ingresá</a></p>
        </section>
    </main>
    <script type="module" src="./registro.ts"></script>
</body>

</html>
